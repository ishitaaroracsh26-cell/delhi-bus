<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <!-- Bus body -->
  <rect x="14" y="12" width="36" height="40" rx="8" fill="#10b981"/>
  <!-- Windshield -->
  <rect x="18" y="16" width="28" height="14" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Headlights -->
  <circle cx="20" cy="42" r="3" fill="#fef08a"/>
  <circle cx="44" cy="42" r="3" fill="#fef08a"/>
  <!-- Grille -->
  <line x1="26" y1="42" x2="38" y2="42" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
  <!-- Wheels -->
  <rect x="16" y="52" width="6" height="4" rx="2" fill="#334155"/>
  <rect x="42" y="52" width="6" height="4" rx="2" fill="#334155"/>
  <!-- Signal radar waves -->
  <path d="M48 10 C 53 15, 53 23, 48 28" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M53 6 C 60 14, 60 28, 53 36" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" fill="none"/>
</svg>
